# M2 · bosque aleatorio con los ocho atributos + diámetro y volumen estimados de los contornos (variante de Hancock y Magnan, 2016) (Tabla 21): cota de lo que las ocho valoraciones del radiólogo explican por sí solas (escenario A). No es un modelo de imagen.
# Entradas: seis atributos ordinales (mediana entre lectores, estandarizados) y dos nominales (moda entre lectores, one-hot);
# la malignidad NUNCA es entrada. Estandarización, imputación (con indicador) y categorías se ajustan solo con el entrenamiento de cada pliegue.
hereda: ../base.yaml

modelo:
  id: M2
  nombre: m2_bosque_diam_vol
  familia: tabular
  imputar: true
  variables:
    numericas: [subtlety_mediana, sphericity_mediana, margin_mediana, lobulation_mediana, spiculation_mediana, texture_mediana, diametro_mm, volumen_mm3]
    categoricas: [internalStructure_moda, calcification_moda]
  estimador: bosque
  parametros:
    n_estimators: 500
    min_samples_leaf: 2
